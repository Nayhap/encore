name: Release

# Push a tag like v0.1.0 to build every platform and attach the installers to
# a draft release with that name. Publish the draft by hand after a check:
# publishing ships it to every Encore within 6 hours, through the in-app
# updater (D24, docs/releases.md). Tags with a "-" (v0.5.0-rc.1) become
# pre-releases, which the updater never sees.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # `app` makes the updater's .app.tar.gz; `dmg` is what people download.
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: --bundles nsis,msi
          # The oldest Ubuntu we support: an AppImage only runs on systems
          # whose glibc is at least as new as the one it was built with.
          - os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Per runner image: C objects built against a newer glibc don't
          # link on an older one.
          key: ${{ matrix.os }}
      - uses: oven-sh/setup-bun@v2
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libdbus-1-dev cmake patchelf
      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake
      - run: bun install --frozen-lockfile
      # Updater packages and their signatures are made for releases only
      # (tauri.conf.json has them off, so other builds need no key). The
      # key reaches this step and no other.
      - name: Build and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Name the macOS updater package
        if: runner.os == 'macOS'
        run: |
          cd target/universal-apple-darwin/release/bundle/macos
          v="${GITHUB_REF_NAME#v}"
          mv Encore.app.tar.gz "Encore_${v}_universal.app.tar.gz"
          mv Encore.app.tar.gz.sig "Encore_${v}_universal.app.tar.gz.sig"
      - name: Self-test the AppImage, .deb and .rpm
        if: runner.os == 'Linux'
        run: |
          scripts/self-test-bundle.sh appimage target/release/bundle/appimage/*.AppImage
          for img in ubuntu:22.04 debian:12 ubuntu:24.04; do
            scripts/self-test-bundle.sh appimage-in "$img" target/release/bundle/appimage/*.AppImage
          done
          scripts/self-test-bundle.sh deb target/release/bundle/deb/*.deb
          scripts/self-test-bundle.sh rpm-in fedora:latest target/release/bundle/rpm/*.rpm
      - name: Self-test the app from the disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls target/*/release/bundle/dmg/*.dmg)
          hdiutil attach -nobrowse -readonly "$dmg" -mountpoint /tmp/encore-dmg
          lipo -archs /tmp/encore-dmg/Encore.app/Contents/MacOS/encore
          codesign --verify --deep --strict /tmp/encore-dmg/Encore.app
          scripts/self-test-bundle.sh app /tmp/encore-dmg/Encore.app
          hdiutil detach /tmp/encore-dmg
      - name: Self-test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/self-test-bundle.ps1 -Installer (Get-Item target/release/bundle/nsis/*-setup.exe).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            target/*/release/bundle/dmg/*.dmg
            target/*/release/bundle/macos/*.app.tar.gz
            target/*/release/bundle/macos/*.app.tar.gz.sig
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # latest.json for the in-app updater (D24): fails unless every
      # platform is there once, the versions agree and every signature
      # verifies with the public key Encore ships.
      - name: Update manifest
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          find dist -type f -print
          scripts/release-manifest.sh "$GITHUB_REF_NAME" dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes=/dev/null
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --draft $pre --title "Encore ${GITHUB_REF_NAME#v}" --notes-file "$notes" $(find dist -type f)
