name: Release

# Push a tag like v0.1.0 to build every platform and attach the installers to
# a draft release with that name. Publish the draft by hand after a check.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: --bundles nsis,msi
          # The oldest Ubuntu we support: an AppImage only runs on systems
          # whose glibc is at least as new as the one it was built with.
          - os: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libdbus-1-dev cmake patchelf
      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake
      - run: bun install --frozen-lockfile
      - run: bun run tauri build ${{ matrix.args }}
      - name: Self-test the AppImage and .deb
        if: runner.os == 'Linux'
        run: |
          scripts/self-test-bundle.sh appimage target/release/bundle/appimage/*.AppImage
          for img in ubuntu:22.04 debian:12 ubuntu:24.04; do
            scripts/self-test-bundle.sh appimage-in "$img" target/release/bundle/appimage/*.AppImage
          done
          scripts/self-test-bundle.sh deb target/release/bundle/deb/*.deb
      - name: Self-test the app from the disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls target/*/release/bundle/dmg/*.dmg)
          hdiutil attach -nobrowse -readonly "$dmg" -mountpoint /tmp/encore-dmg
          lipo -archs /tmp/encore-dmg/Encore.app/Contents/MacOS/encore
          codesign --verify --deep --strict /tmp/encore-dmg/Encore.app
          scripts/self-test-bundle.sh app /tmp/encore-dmg/Encore.app
          hdiutil detach /tmp/encore-dmg
      - name: Self-test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/self-test-bundle.ps1 -Installer (Get-Item target/release/bundle/nsis/*-setup.exe).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            target/*/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f -print
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$GITHUB_REF_NAME" --draft --title "Encore ${GITHUB_REF_NAME#v}" --notes-file "$notes" $(find dist -type f)
