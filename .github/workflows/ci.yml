name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
          - os: windows-latest
            bundles: nsis,msi
          # The oldest Ubuntu we support: an AppImage only runs on systems
          # whose glibc is at least as new as the one it was built with.
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Per runner image: C objects built against a newer glibc don't
          # link on an older one.
          key: ${{ matrix.os }}
      - uses: oven-sh/setup-bun@v2
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libdbus-1-dev cmake patchelf
          # For the self-test: yt-dlp needs Python 3.11, Ubuntu 22.04 has 3.10.
          sudo apt-get install -y python3.11 python3.11-venv
      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake
      - run: bun install --frozen-lockfile
      # The app crate embeds the built UI, so build it before compiling tests.
      - run: bun run build
      - run: cargo test --workspace
      - run: git diff --exit-code src/lib/backend/bindings.ts
      - run: bun run check
      - name: Bundle
        run: bun run tauri build --bundles ${{ matrix.bundles }}
      # Run the built artifact the way users get it: set up yt-dlp with the
      # system's Python, resolve a song and decode it. This is the path the
      # AppImage playback and no-audio-device bugs hid in.
      - name: Self-test the AppImage
        if: runner.os == 'Linux'
        run: scripts/self-test-bundle.sh appimage target/release/bundle/appimage/*.AppImage
      - name: Self-test the AppImage on fresh Ubuntu 22.04, Debian 12 and Ubuntu 24.04
        if: runner.os == 'Linux'
        run: |
          for img in ubuntu:22.04 debian:12 ubuntu:24.04; do
            echo "::group::$img"
            scripts/self-test-bundle.sh appimage-in "$img" target/release/bundle/appimage/*.AppImage
            echo "::endgroup::"
          done
      - name: Self-test the .deb
        if: runner.os == 'Linux'
        run: scripts/self-test-bundle.sh deb target/release/bundle/deb/*.deb
      - name: Self-test the app (macOS)
        if: runner.os == 'macOS'
        run: scripts/self-test-bundle.sh app target/release/bundle/macos/Encore.app
      - name: Self-test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/self-test-bundle.ps1 -Installer (Get-Item target/release/bundle/nsis/*-setup.exe).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: encore-${{ runner.os }}
          path: |
            target/release/bundle/macos/*.app
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
