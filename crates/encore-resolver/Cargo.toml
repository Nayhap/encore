[package]
name = "encore-resolver"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
encore-core.workspace = true
encore-auth.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
parking_lot.workspace = true
specta.workspace = true
tracing.workspace = true
hex.workspace = true
thiserror.workspace = true
url.workspace = true
regex = "1"
dirs = "6"
# The challenge solver's engine (D37). rquickjs-sys 0.14.0 bundles QuickJS-ng
# 0.16.2; upstream.toml records both. Pinned exactly: a new engine is a
# reviewed change, like a new solver.
rquickjs = "=0.14.0"
sha3 = "0.11"

# glibc keeps a solve's freed memory unless asked to give it back.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
