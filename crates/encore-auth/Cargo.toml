[package]
name = "encore-auth"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
encore-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
url.workspace = true
tracing.workspace = true
rusqlite.workspace = true
httpdate = "1"
# One store per OS (D9): Keychain, Credential Manager, Secret Service.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
aes-gcm = "0.11"
getrandom = "0.4"
base64.workspace = true
aes = "0.9"
cbc = { version = "0.2", features = ["block-padding", "alloc"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
dirs = "6"
parking_lot.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
dbus = "0.9"
dbus-secret-service = { version = "4", features = ["crypto-rust"] }
