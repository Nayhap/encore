server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /site.webmanifest { default_type application/manifest+json; types { } add_header Cache-Control "public, max-age=86400"; }

    location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options "nosniff" always; }
    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; add_header X-Content-Type-Options "nosniff" always; }

    # Fonts and icons never change in place.
    location ~* ^/assets/(fonts/.+\.woff2|icon-.+\.png|apple-touch-icon\.png)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Screens, CSS and JS: cache for a week, revalidate after.
    location /assets/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache"; }
}
