[package]
name = "encore"
version = "0.1.0"
description = "Encore, a YouTube Music desktop client"
authors = ["Encore"]
edition = "2024"
license = "MIT"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "encore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { workspace = true }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta-typescript = "=0.0.13"
encore-core.workspace = true
encore-ytm.workspace = true
encore-auth.workspace = true
encore-audio.workspace = true
encore-lyrics.workspace = true
encore-resolver.workspace = true
encore-player.workspace = true
tokio.workspace = true
reqwest.workspace = true
url.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Now Playing (macOS), SMTC (Windows), MPRIS over D-Bus (Linux).
souvlaki = "0.9.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString", "NSObject"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
